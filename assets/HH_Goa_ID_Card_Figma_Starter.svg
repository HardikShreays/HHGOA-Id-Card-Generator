<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <title>HH Goa 2026 - Editable ID Card Starter</title>
  <desc>Import into Figma, ungroup, and edit the named groups, text, colors, and photo placeholder.</desc>
  <defs>
    <clipPath id="photoClip">
      <rect x="72" y="224" width="628" height="776" rx="24"/>
    </clipPath>
  </defs>

  <g id="01_Background">
    <rect width="1080" height="1350" fill="#FFFBE8"/>
    <rect y="1334" width="1080" height="16" fill="#0B6839"/>
  </g>

  <g id="02_Header">
    <rect width="1080" height="186" fill="#0B6839"/>
    <rect y="186" width="1080" height="16" fill="#FEE101"/>
    <text x="66" y="112" fill="#FEE101" font-family="Imbue, Georgia, serif" font-size="74" font-weight="700" textLength="700" lengthAdjust="spacingAndGlyphs">HACKER HOUSE</text>
    <text x="69" y="151" fill="#FFFFFF" font-family="Victor Mono, monospace" font-size="17" font-weight="700" letter-spacing="4">GOA &#183; 2026</text>
    <g id="Goa_Badge">
      <circle cx="937" cy="94" r="65" fill="#FF0080" stroke="#000000" stroke-width="5"/>
      <text x="937" y="104" text-anchor="middle" fill="#FEE101" font-family="Victor Mono, monospace" font-size="24" font-weight="700">GOA</text>
    </g>
  </g>

  <g id="03_Photo_Area">
    <rect x="84" y="238" width="628" height="776" rx="24" fill="#000000"/>
    <rect x="65" y="217" width="642" height="790" rx="28" fill="#FF0080" stroke="#000000" stroke-width="5"/>
    <g clip-path="url(#photoClip)">
      <rect x="72" y="224" width="628" height="776" fill="#9AC95F"/>
      <circle cx="570" cy="360" r="90" fill="#FEE101" stroke="#000000" stroke-width="5"/>
      <path d="M72 820 Q180 730 290 815 T510 810 T700 790 V1000 H72Z" fill="#0B6839"/>
      <path d="M72 875 Q180 785 290 870 T510 865 T700 845" fill="none" stroke="#FFFBE8" stroke-width="15"/>
      <circle cx="386" cy="540" r="112" fill="#FFFBE8" stroke="#000000" stroke-width="6"/>
      <path d="M178 995 Q205 710 386 710 Q570 710 598 995" fill="#FFFBE8" stroke="#000000" stroke-width="6"/>
      <text x="386" y="945" text-anchor="middle" fill="#0B6839" font-family="Victor Mono, monospace" font-size="22" font-weight="700">REPLACE WITH YOUR PHOTO</text>
    </g>
    <rect x="72" y="224" width="628" height="776" rx="24" fill="none" stroke="#000000" stroke-width="5"/>
  </g>

  <g id="04_Access_Panel">
    <rect x="728" y="224" width="280" height="776" rx="22" fill="#FEE101" stroke="#000000" stroke-width="5"/>
    <text x="758" y="292" fill="#000000" font-family="Victor Mono, monospace" font-size="18" font-weight="700">BUILDER ACCESS</text>
    <text x="758" y="340" fill="#000000" font-family="Victor Mono, monospace" font-size="15" font-weight="700">28&#8211;31 OCT 2026</text>
    <text x="758" y="376" fill="#000000" font-family="Victor Mono, monospace" font-size="15" font-weight="700">GOA, INDIA</text>
    <rect x="758" y="402" width="220" height="4" fill="#000000"/>
    <text x="758" y="490" fill="#000000" font-family="Imbue, Georgia, serif" font-size="72" font-weight="700">2026</text>
    <circle cx="868" cy="535" r="62" fill="#FF0080"/>
    <text x="868" y="543" text-anchor="middle" fill="#FFFFFF" font-family="Victor Mono, monospace" font-size="13" font-weight="700">SHIP</text>

    <g id="Sticker">
      <rect x="758" y="580" width="194" height="50" rx="12" fill="#000000"/>
      <rect x="752" y="572" width="194" height="50" rx="12" fill="#FF0080" stroke="#000000" stroke-width="3"/>
      <text x="849" y="604" text-anchor="middle" fill="#FFFFFF" font-family="Victor Mono, monospace" font-size="15" font-weight="700">LESS NOISE</text>
    </g>

    <g id="Wave_Doodle" fill="none" stroke="#0B6839" stroke-width="5" stroke-linecap="round">
      <path d="M760 720 q20-22 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M760 750 q20-22 40 0 t40 0 t40 0 t40 0 t40 0"/>
      <path d="M760 780 q20-22 40 0 t40 0 t40 0 t40 0 t40 0"/>
    </g>

    <g id="Studio_Credit">
      <rect x="770" y="838" width="194" height="96" rx="18" fill="#0B6839" stroke="#000000" stroke-width="4"/>
      <text x="867" y="878" text-anchor="middle" fill="#FEE101" font-family="Victor Mono, monospace" font-size="21" font-weight="700">2:47 PM</text>
      <text x="867" y="908" text-anchor="middle" fill="#FFFFFF" font-family="Victor Mono, monospace" font-size="15" font-weight="700">STUDIO</text>
    </g>
  </g>

  <g id="05_Builder_Details">
    <text id="Builder_Name" x="72" y="1094" fill="#0B6839" font-family="Imbue, Georgia, serif" font-size="72" font-weight="700">YOUR NAME</text>
    <text id="Builder_Role" x="76" y="1147" fill="#000000" font-family="Victor Mono, monospace" font-size="25" font-weight="700">STACK / ROLE</text>
    <text id="Builder_Title" x="76" y="1192" fill="#FF0080" font-family="Victor Mono, monospace" font-size="20" font-weight="700">&#8220;BUILDING THE SIGNAL&#8221;</text>
    <text id="Builder_ID" x="76" y="1252" fill="#000000" font-family="Victor Mono, monospace" font-size="18" font-weight="700">#HH-GOA-2026</text>
  </g>

  <g id="06_Barcode" fill="#000000">
    <rect x="76" y="1270" width="3" height="30"/>
    <rect x="84" y="1270" width="7" height="30"/>
    <rect x="98" y="1270" width="3" height="30"/>
    <rect x="108" y="1270" width="10" height="30"/>
    <rect x="124" y="1270" width="5" height="30"/>
    <rect x="136" y="1270" width="3" height="30"/>
    <rect x="146" y="1270" width="9" height="30"/>
    <rect x="162" y="1270" width="4" height="30"/>
    <rect x="173" y="1270" width="12" height="30"/>
    <rect x="192" y="1270" width="4" height="30"/>
    <rect x="203" y="1270" width="8" height="30"/>
    <rect x="219" y="1270" width="3" height="30"/>
    <rect x="229" y="1270" width="11" height="30"/>
    <rect x="248" y="1270" width="5" height="30"/>
    <rect x="261" y="1270" width="8" height="30"/>
    <rect x="277" y="1270" width="3" height="30"/>
    <rect x="287" y="1270" width="12" height="30"/>
    <rect x="307" y="1270" width="4" height="30"/>
    <rect x="319" y="1270" width="9" height="30"/>
    <rect x="336" y="1270" width="3" height="30"/>
    <rect x="346" y="1270" width="12" height="30"/>
    <rect x="366" y="1270" width="5" height="30"/>
    <rect x="379" y="1270" width="10" height="30"/>
    <rect x="397" y="1270" width="4" height="30"/>
    <rect x="410" y="1270" width="11" height="30"/>
  </g>

  <g id="07_Social_Handles">
    <text x="460" y="1242" fill="#000000" font-family="Victor Mono, monospace" font-size="14" font-weight="600">X @HANDLE &#183; GH @USERNAME</text>
    <text x="460" y="1269" fill="#000000" font-family="Victor Mono, monospace" font-size="14" font-weight="600">IG @HANDLE</text>
  </g>

  <g id="08_QR_Placeholder">
    <rect x="850" y="1080" width="152" height="152" fill="#FFFBE8" stroke="#000000" stroke-width="4"/>
    <g fill="#000000">
      <rect x="862" y="1092" width="40" height="40"/>
      <rect x="870" y="1100" width="24" height="24" fill="#FFFBE8"/>
      <rect x="950" y="1092" width="40" height="40"/>
      <rect x="958" y="1100" width="24" height="24" fill="#FFFBE8"/>
      <rect x="862" y="1180" width="40" height="40"/>
      <rect x="870" y="1188" width="24" height="24" fill="#FFFBE8"/>
      <rect x="916" y="1098" width="10" height="10"/>
      <rect x="914" y="1120" width="20" height="10"/>
      <rect x="908" y="1142" width="12" height="24"/>
      <rect x="932" y="1144" width="16" height="10"/>
      <rect x="958" y="1144" width="22" height="14"/>
      <rect x="920" y="1174" width="14" height="14"/>
      <rect x="944" y="1174" width="10" height="28"/>
      <rect x="968" y="1172" width="18" height="12"/>
      <rect x="918" y="1208" width="18" height="12"/>
      <rect x="960" y="1204" width="28" height="14"/>
    </g>
    <text x="926" y="1258" text-anchor="middle" fill="#000000" font-family="Victor Mono, monospace" font-size="12" font-weight="700">QR PLACEHOLDER</text>
  </g>

  <g id="09_Footer_Decoration" fill="#0B6839" opacity=".18">
    <path d="M0 1320 L0 1280 Q100 1240 200 1280 T400 1280 T600 1280 T800 1280 T1080 1280 L1080 1320Z"/>
  </g>
</svg>
